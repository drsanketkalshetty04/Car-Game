<title>Dusk Highway</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D view; instruments pinned to the corners like a dashboard; garage card docks to the side (landscape) or bottom (portrait) so the car stays in view. */
:root{
  color-scheme: dark;
  --asphalt:#17161f;
  --ink:#fff3e2;
  --ink-dim:#d9c4b4;
  --amber:#ffb347;
  --tail:#ff4334;
  --gold:#ffd24a;
  --good:#6fd08c;
  --nitro:#58c8ff;
  --panel:rgba(23,20,32,.62);
  --panel-solid:rgba(30,26,40,.94);
  --line:rgba(255,243,226,.22);
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --gt:calc(12px + env(safe-area-inset-top, 0px));
  --gb:calc(16px + env(safe-area-inset-bottom, 0px));
}
html,body{height:100%}
body{background:var(--asphalt);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:var(--gt) var(--gb)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dash{display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.speed{display:flex;align-items:baseline;gap:6px}
.speed b{font:800 60px/0.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:2.1ch;text-align:right}
.speed span{font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.speed em{font:800 20px var(--display);font-style:normal;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-left:4px;align-self:center}
.bar{width:150px;height:7px;background:rgba(23,20,32,.6);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.meter{display:flex;align-items:center;gap:8px}
.meter label{font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);width:38px}
.meter .bar{width:104px}
#hp{background:var(--good)} #nos{background:var(--nitro)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:0;flex:1 1 0}
.odo{font:700 21px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.06em;
  background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:4px}
.odo small{font-size:12px;letter-spacing:.14em;color:var(--ink-dim);margin-left:4px}
.score{font:700 14px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-shadow:0 1px 6px rgba(0,0,0,.6);text-align:right}
.score b{color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums;margin-left:5px}
.coin{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px rgba(120,80,0,.45);margin-right:5px;vertical-align:-.02em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.chip{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-height:36px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.chip:focus-visible,.btn:focus-visible,.arrow:focus-visible,.sw:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.toast{position:fixed;left:50%;top:27%;transform:translateX(-50%);font:800 24px var(--display);letter-spacing:.08em;max-width:92%;text-align:center;
  text-transform:uppercase;color:var(--amber);text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding-left:var(--gl);padding-right:var(--gr);padding-bottom:var(--gb);pointer-events:none}
.wheel{width:128px;height:128px;border-radius:50%;border:13px solid rgba(255,243,226,.85);background:rgba(23,20,32,.28);
  position:relative;touch-action:none;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:grab}
.wheel::before{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:12px;margin-top:-2px;background:rgba(255,243,226,.85);border-radius:3px}
.wheel::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:52%;margin-left:-6px;background:rgba(255,243,226,.85);border-radius:3px}
.wheel i{position:absolute;left:50%;top:-13px;width:10px;height:13px;margin-left:-5px;background:var(--amber);border-radius:2px}
.pad{display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:auto}
.fn{display:flex;gap:12px}
.round{touch-action:none;width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.round.nitro{border-color:var(--nitro);color:var(--nitro)}
.round.down{transform:scale(.94);background:rgba(88,200,255,.25)}
.pedals{display:flex;gap:12px;align-items:flex-end}
.pedal{touch-action:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;
  font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;cursor:pointer;
  background-image:repeating-linear-gradient(0deg,transparent 0 9px,rgba(255,243,226,.12) 9px 11px)}
.pedal.brake{width:84px;height:74px}
.pedal.gas{width:70px;height:118px}
.pedal.down{transform:translateY(3px) scale(.97);border-color:var(--amber);color:var(--amber)}
.pedal.brake.down{border-color:var(--tail);color:var(--tail)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:var(--gl);padding-right:var(--gr);padding-block:var(--gt) var(--gb);
  background:linear-gradient(180deg,rgba(23,20,32,.2),rgba(23,20,32,.65));overflow:auto}
.overlay.garage{background:none;align-items:flex-end}
@media (min-aspect-ratio:1/1){ .overlay.garage{align-items:center;justify-content:flex-end} .overlay.garage .card{width:min(100%,370px);max-height:100%;overflow:auto} }
.card{width:min(100%,420px);background:var(--panel-solid);border:1px solid var(--line);border-top:4px solid var(--amber);
  border-radius:6px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:0;font:800 40px/0.95 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-dim)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head h1{font-size:26px}
.wallet{font:800 20px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick{display:flex;align-items:center;gap:10px}
.pick .name{flex:1;min-width:0;text-align:center}
.pick .name b{display:block;font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pick .name span{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font:800 22px var(--display);cursor:pointer}
.statlist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.statlist span{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.statlist .bar{width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--amber)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts .chip{padding:7px 10px;font-size:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats span{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.stats b{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 auto;font:800 19px var(--display);letter-spacing:.1em;text-transform:uppercase;color:#1b1420;background:var(--amber);border:0;border-radius:4px;
  padding:12px 16px;min-height:50px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.note{font-size:12.5px}
@media (max-width:480px){.speed b{font-size:50px}.chip{padding:8px 10px}}
@media (max-height:430px){
  .speed b{font-size:44px}
  .wheel{width:104px;height:104px;border-width:11px}
  .pedal.gas{height:92px}.pedal.brake{height:60px}.round{width:52px;height:52px;font-size:12px}
  .pad{gap:8px}
  .card{padding:12px 16px;gap:8px}.card h1{font-size:26px}.head h1{font-size:20px}
  .btn{min-height:44px;padding:8px 14px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<canvas id="view" aria-label="3D highway view"></canvas>

<div class="hud" id="hud" hidden>

<script>
(function(){

var $ = function(id){ return document.getElementById(id); };
var card = $('card'), overlay = $('overlay');

}
var rand = Math.random, clamp = function(v,a,b){ return v<a?a:v>b?b:v; };

/* ---------- saved progress ---------- */
var save = {coins:0, owned:[0], car:0, paint:0, best:0, sens:1, invert:false, sound:true, hood:false};
(function load(){
  try {
    var s = JSON.parse(localStorage.getItem('duskHighwaySave')||'null');

/* ---------- car catalogue ---------- */
var CARS = [

  {name:'Bandit 427', kind:'Muscle car',    top:220, acc:14.5, grip:1.0,  tough:0.9,  price:2000, spec:{len:4.8, wid:1.92, h:0.5,  cabL:1.7, cabH:0.42, cabZ:0.7, scoop:1}},

  {name:'Tauro V12',  kind:'Wedge supercar',top:270, acc:18,   grip:1.3,  tough:1.2,  price:4500, spec:{len:4.7, wid:2.05, h:0.34, cabL:1.7, cabH:0.34, cabZ:-0.1, nose:1, spoiler:1, wing:1}},
  {name:'Zephyr X',   kind:'Hypercar',      top:300, acc:21,   grip:1.35, tough:1.25, price:8000, spec:{len:4.8, wid:2.05, h:0.32, cabL:1.5, cabH:0.33, cabZ:-0.25, nose:1, spoiler:1, wing:1, scoop:1}}
];
var ORDER = CARS.map(function(c,i){ return i; }).sort(function(a,b){ return CARS[a].price - CARS[b].price; });
var PAINTS = [0xd9342b,0x2f6fd0,0xf2c230,0xf1ece2,0x2f9a6a,0x2a2c38,0xe8742a,0x8a4fc0];
var pick = clamp(save.car|0, 0, CARS.length-1);

/* ---------- renderer & scene ---------- */
var canvas = $('view'), renderer;
try { renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){ card.innerHTML = '<h1>No 3D support</h1><p>This browser could not start WebGL. Try Chrome or Safari on your phone.</p>'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf2a565, 70, 400);
function mkCanvas(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
var skyC = mkCanvas(4,256), skyG = skyC.getContext('2d'), skyTex = new THREE.CanvasTexture(skyC);
scene.background = skyTex;
var camera = new THREE.PerspectiveCamera(62, 1, 0.4, 700);
var hemi = new THREE.HemisphereLight(0xffd9b0, 0x3a3046, 0.95); scene.add(hemi);

sun.position.set(-60, 26, -560); scene.add(sun);

/* ---------- road ---------- */
var LEN = 520, Z0 = 40, ROAD_HALF = 7, LANES = [-5.25,-1.75,1.75,5.25], PERIOD = 12;
var ground = new THREE.Mesh(new THREE.PlaneGeometry(900, LEN+200), new THREE.MeshLambertMaterial({color:0x4a4038}));
ground.rotation.x = -Math.PI/2; ground.position.set(0,-0.05, Z0-LEN/2); scene.add(ground);
var roadTex = (function(){
  var c = mkCanvas(512,512), g = c.getContext('2d'), i;
  g.fillStyle='#2a2932'; g.fillRect(0,0,512,512);
  for(i=0;i<2600;i++){ g.fillStyle = rand()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.08)'; g.fillRect(rand()*512,rand()*512,2,2); }
  var X = function(m){ return (m+8)/16*512; };
  LANES.forEach(function(m){ g.fillStyle='rgba(0,0,0,.11)'; g.fillRect(X(m-0.8)-9,0,18,512); g.fillRect(X(m+0.8)-9,0,18,512); });

  g.fillStyle='#f0c24a'; g.fillRect(X(-7)-4,0,8,512); g.fillRect(X(7)-4,0,8,512);

  var t = new THREE.CanvasTexture(c); t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, LEN/PERIOD);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;

var road = new THREE.Mesh(new THREE.PlaneGeometry(16, LEN), new THREE.MeshLambertMaterial({map:roadTex}));
road.rotation.x = -Math.PI/2; road.position.set(0,0,Z0-LEN/2); scene.add(road);
var kerbTex = (function(){
  var c = mkCanvas(8,64), g = c.getContext('2d');
  g.fillStyle='#e9e2d6'; g.fillRect(0,0,8,64); g.fillStyle='#c8402f'; g.fillRect(0,0,8,32);
  var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = THREE.NearestFilter; return t;
})();
var kerbs = [-1,1].map(function(s){
  var t = kerbTex.clone(); t.needsUpdate = true; t.rotation = Math.PI/2; t.repeat.set(LEN/4,1);
  var m = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.45,LEN), new THREE.MeshLambertMaterial({map:t}));
  m.position.set(s*8.25,0.22,Z0-LEN/2); scene.add(m); return t;
});

var walkTex = (function(){
  var c = mkCanvas(128,128), g = c.getContext('2d');
  g.fillStyle='#8f8a86'; g.fillRect(0,0,128,128);
  for (var i=0;i<500;i++){ g.fillStyle = rand()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)'; g.fillRect(rand()*128,rand()*128,2,2); }
  g.strokeStyle='rgba(40,36,40,.55)'; g.lineWidth=2; for (i=0;i<=128;i+=32){ g.beginPath(); g.moveTo(i,0); g.lineTo(i,128); g.moveTo(0,i); g.lineTo(128,i); g.stroke(); }
  var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, LEN/4); return t;
})();
[-1,1].forEach(function(s){
  var m = new THREE.Mesh(new THREE.PlaneGeometry(11.5, LEN), new THREE.MeshLambertMaterial({map:walkTex}));
  m.rotation.x = -Math.PI/2; m.position.set(s*14.2, 0.3, Z0-LEN/2); scene.add(m);
});

/* ---------- light pools & beams (fade in after dark) ---------- */

    if (o!==self && o.active && (o.lane===lane || o.pending===lane) && Math.abs(o.z - z) < gap) return false; }
  return true;
}
function spawn(c, zMin, zMax){

    var lane = (rand()*4)|0, z = -(zMin + rand()*(zMax-zMin));

      c.base = (c.len>5 ? 32+rand()*22 : 38+rand()*46)/3.6 + Math.min(stage,8)*0.5; c.speed = c.base;
      c.active = true; c.mesh.visible = true; c.bl.visible = c.br.visible = false; return;

    if (v && el.setPointerCapture) { try{ el.setPointerCapture(e.pointerId); }catch(_){} } }; };

(function wheelDrag(){
  var el = $('wheel'), prev = null, deg = 0;
  var ang = function(e){ var r = el.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top+r.height/2), e.clientX - (r.left+r.width/2))*57.2958; };
  el.addEventListener('pointerdown', function(e){ e.preventDefault(); prev = ang(e); deg = input.steer*WHEEL_LOCK; try{ el.setPointerCapture(e.pointerId); }catch(_){}
    if (mode==='tilt'){ setMode('touch'); toast('Touch steering'); } });
  el.addEventListener('pointermove', function(e){ if (prev===null) return;
    var a = ang(e), d = a - prev; if (d > 180) d -= 360; if (d < -180) d += 360; prev = a;
    deg = clamp(deg + d, -WHEEL_LOCK, WHEEL_LOCK); input.wheel = deg/WHEEL_LOCK; });
  var end = function(){ prev = null; input.wheel = 0; };

addEventListener('keydown', function(e){ key(e,true); }); addEventListener('keyup', function(e){ key(e,false); });
function key(e, v){
  var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if (k==='ArrowLeft'||k==='a') input.keyL = v;
  else if (k==='ArrowRight'||k==='d') input.keyR = v;
  else if (k==='ArrowUp'||k==='w') input.gas = v;
  else if (k==='ArrowDown'||k==='s'||k===' ') input.brake = v;
  else if (k==='Shift'||k==='n') input.nitro = v;
  else if (v && k==='h') horn();
  else if (v && k==='c') toggleView();
  else if (v && (k==='p'||k==='Escape')) { togglePause(); return; }
  else if (v && k==='Enter' && state!=='play') { var b = card.querySelector('.btn:not(.ghost)'); if (b) b.click(); return; }

/* tilt: orientation angles where available, gravity vector as a fallback */
function screenAngle(){ var a = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : (window.orientation||0); return ((a%360)+360)%360; }
function setMode(m){

  var b = $('modeBtn'); b.textContent = mode==='tilt' ? 'Tilt' : 'Touch'; b.setAttribute('aria-pressed', mode==='tilt');
}

  var a = screenAngle(), lat = a===90 ? -g.y : a===270 ? g.y : a===180 ? -g.x : g.x;

/* ---------- audio ---------- */
var audio = null;
function initAudio(){
  if (audio) { audio.ctx.resume && audio.ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try {
    var ctx = new AC(), o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(ctx.destination); o1.start(); o2.start();
    var nb = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate), nd = nb.getChannelData(0); for (var i=0;i<nd.length;i++) nd[i] = rand()*2-1;
    var ws = ctx.createBufferSource(), wf = ctx.createBiquadFilter(), wg = ctx.createGain(); ws.buffer = nb; ws.loop = true; wf.type = 'bandpass'; wf.frequency.value = 600; wg.gain.value = 0;
    ws.connect(wf); wf.connect(wg); wg.connect(ctx.destination); ws.start();
    audio = {ctx:ctx, o1:o1, o2:o2, f:f, g:g, wf:wf, wg:wg};
  } catch(e){ audio = null; }
}
function noise(len, vol){
  if (!audio || !save.sound) return;
  var ctx = audio.ctx, n = Math.floor(ctx.sampleRate*len), buf = ctx.createBuffer(1,n,ctx.sampleRate), d = buf.getChannelData(0);
  for (var i=0;i<n;i++) d[i] = (rand()*2-1)*Math.pow(1-i/n,2.2);
  var s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = vol; s.buffer = buf; s.connect(g); g.connect(ctx.destination); s.start();
}
function beep(freqs, len, vol, type){
  if (!audio || !save.sound) return;
  var ctx = audio.ctx, t = ctx.currentTime, g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+len); g.connect(ctx.destination);
  freqs.forEach(function(f){ var o = ctx.createOscillator(); o.type = type||'square'; o.frequency.value = f; o.connect(g); o.start(t); o.stop(t+len); });
}
function horn(){
  if (state!=='play' || hornCd > 0) return;
  hornCd = 1.6; beep([415,520], 0.45, 0.07);
  traffic.forEach(function(c){
    if (!c.active || c.pending!==null || c.z > -4 || c.z < -75 || Math.abs(c.x - player.x) > 1.7) return;
    var opts = [c.lane-1, c.lane+1].filter(function(l){ return l>=0 && l<4 && laneFree(l, c.z, 14, c); });
    if (opts.length) signal(c, opts[(rand()*opts.length)|0], 0.45);

}

/* ---------- simulation ---------- */
var GEARS = [0,0.14,0.29,0.46,0.64,0.82,1.3];
function update(dt){
  time += dt;
  var playing = state==='play', d = player.def, MAXV = d.top/3.6, wet = 1 - cur.rain*0.28, i;
  if (envT < 1){ envT = Math.min(1, envT + dt/5); mixEnv(envT); }
  if (hornCd > 0) hornCd -= dt;
  if (invuln > 0) invuln -= dt;
  if (playing && tiltWarn > 0){ tiltWarn -= dt; if (tiltWarn <= 0 && !tilt.seen && window.matchMedia && matchMedia('(pointer:coarse)').matches) toast('Tilt is blocked on this page. Use the wheel.'); }
  // steering input
  var target = 0;
  if (playing){
    if (mode==='tilt'){ target = clamp((tilt.raw - tilt.zero)/[38,26,17][save.sens], -1, 1)*(save.invert?-1:1); target = Math.abs(target) < 0.03 ? 0 : (target<0?-1:1)*Math.pow(Math.abs(target), 1.5); }
    else target = input.wheel;
    if (input.keyL) target -= 1;
    if (input.keyR) target += 1;
    target = clamp(target,-1,1);
  }
  input.steer += (target - input.steer)*Math.min(1, dt*(target===0?5:7));
  // speed
  boosting = playing && input.nitro && nitro > 0 && player.speed > 3;
  if (playing){
    var a;
    if (input.brake) a = -26*wet - player.speed*0.15;
    else if (boosting) a = Math.max((d.acc + 9)*(1 - player.speed/(MAXV*1.22)) + 0.5, d.acc*0.3);
    else if (input.gas) a = Math.max(d.acc*(1 - player.speed/MAXV) + 0.4, d.acc*0.11);   // past its power band the car keeps gaining, slowly, with no ceiling
    else a = -1.6 - player.speed*0.02;
    a -= Math.abs(input.steer)*Math.min(player.speed, 45)*0.045;
    player.speed = Math.max(0, player.speed + a*dt);
    if (boosting) nitro = Math.max(0, nitro - 26*dt);
  } else if (state==='over') player.speed = Math.max(0, player.speed - 45*dt);
  else if (state==='menu') player.speed = 0;
  var v = player.speed, move = (state==='pause') ? 0 : v*Math.cos(player.yaw)*dt;
  // heading & lateral motion
  if (playing){
    var turn = input.steer*1.05*d.grip*wet*Math.min(1, v/9)/(1 + v/24);
    yawRate += (turn - yawRate)*Math.min(1, dt*5);            // the car eases into and out of a turn
    player.yaw = clamp(player.yaw + yawRate*dt, -0.42, 0.42);
    player.yaw -= player.yaw*Math.min(1, dt*(1 - Math.min(1, Math.abs(input.steer)*4))*(1.2 + v/30));   // caster: it straightens as the wheel returns to centre
    player.x += Math.sin(player.yaw)*v*dt;
    var lim = ROAD_HALF - player.wid/2;
    var edge = Math.abs(player.x) - (lim - 0.5), side = player.x > 0 ? 1 : -1;
    if (edge > 0 && player.yaw*side > -0.02){                 // kerb guide: ease the nose back onto the road, no speed lost
      player.yaw += (-side*0.03 - player.yaw)*Math.min(1, dt*(4 + edge*14)); yawRate *= 0.5; }
    player.x = clamp(player.x, -lim, lim);
    dist += move;
    var st = Math.floor(dist/STAGE_LEN);
    if (st > stage && state==='play'){ stage = st; bonus += 100; setEnv(stage, false);
      var label = 'Stage '+(stage+1)+' '+ENVS[stage%4].name; $('stage').textContent = label; toast(label+' +100'); beep([523,784],0.3,0.05,'triangle'); }
    playing = state==='play';
  }
  // world scroll
  roadTex.offset.y = (roadTex.offset.y + move/PERIOD) % 1;
  kerbs.forEach(function(t){ t.offset.x = (t.offset.x - move/4) % 1; });
  walkTex.offset.y = (walkTex.offset.y + move/4) % 1;
  for (i=0;i<scenery.length;i++){ var s = scenery[i]; s.position.z += move; if (s.position.z > Z0) s.position.z -= LEN; }
  // coins
  if (playing){ coinTimer -= dt; if (coinTimer <= 0){ coinTimer = 5 + rand()*5; spawnCoins(); } }
  for (i=0;i<coins.length;i++){ var cn = coins[i]; if (!cn.visible) continue;
    var cz0 = cn.position.z; cn.position.z += move; cn.rotation.y += dt*4;
    if (playing && cz0 < 1.9 && cn.position.z > -1.9 && Math.abs(cn.position.x - player.x) < 1.35){ cn.visible = false; pickups++; nitro = Math.min(100, nitro+5); beep([988,1319],0.12,0.04,'triangle'); }
    else if (cn.position.z > 20) cn.visible = false; }
  // traffic
  if (state==='play' || state==='over'){
    var want = activeTarget(), count = 0;
    traffic.forEach(function(c){ if (c.active) count++; });
    for (i=0;i<traffic.length;i++){
      var c = traffic[i];
      if (!c.active){ if (playing && count < want){ c.respawn = (c.respawn||0) - dt; if (c.respawn <= 0){ spawn(c, 230, 400); if (c.active) count++; } } continue; }
      var vt = c.base;
      for (var j=-1;j<traffic.length;j++){
        var o = j<0 ? player : traffic[j]; if (o===c || (j>=0 && !o.active)) continue;
        var ox = j<0 ? player.x : o.x, oz = j<0 ? 0 : o.z, gap = c.z - oz - (c.len+o.len)/2;
        if (gap > -1 && gap < 11 && Math.abs(ox - c.x) < (c.wid+o.wid)/2 + 0.35) vt = Math.min(vt, o.speed*0.92);
      }
      c.speed += (vt - c.speed)*Math.min(1, dt*2.5);
      var pz = c.z; c.z += (v - c.speed)*dt;
      if (playing){
        c.timer -= dt;
        if (c.timer < 0 && c.pending===null){
          c.timer = Math.max(3, 8 - stage*0.5) + rand()*9;
          var nl = c.lane + (rand()<.5?-1:1);
          if (nl>=0 && nl<4 && c.z < -28 && c.z > -170 && laneFree(nl, c.z, 16, c)) signal(c, nl, 1.3);
        }
      }
      if (c.pending!==null){
        c.blinkT -= dt; var on = (time*3.2 % 1) < 0.5;
        c.bl.visible = on && c.dir<0; c.br.visible = on && c.dir>0;
        if (c.blinkT <= 0){ c.lane = c.pending; if (Math.abs(c.x - LANES[c.lane]) < 0.08){ c.pending = null; c.bl.visible = c.br.visible = false; } }
      }
      var dx = LANES[c.lane] - c.x, stepX = clamp(dx, -1.7*dt, 1.7*dt); c.x += stepX;
      if (playing){
        var ax = Math.abs(c.x - player.x), az = Math.abs(c.z), hx = (c.wid + player.wid)/2 - 0.1, hz = (c.len + player.len)/2 - 0.15;
        if (ax < hx && pz < -hz && c.z > hz){ c.z = -hz + 0.01; az = hz - 0.01; }
        if (ax < hx && az < hz){
          var rel = Math.abs(v - c.speed);
          if (hx - ax < hz - az){            // side contact: slide apart
            player.x += (player.x > c.x ? 1 : -1)*(hx - ax); player.yaw *= 0.3; player.speed *= 0.97; hit(9, false);
          } else if (c.z < 0){               // ran into the back of it
            c.z = -hz; hit(8 + rel*3, rel > 7); player.speed = Math.min(player.speed, c.speed*0.8); c.speed += Math.min(6, rel*0.4);
          } else { c.z = hz; c.speed = Math.min(c.speed, v*0.9); hit(8, false); }
          playing = state==='play';
        } else if (!c.passed && c.z > hz){ c.passed = true;
          if (ax - hx < 0.75 && v - c.speed > 6){ bonus += 50; passes++; nitro = Math.min(100, nitro+22); toast('Close pass +50'); } }
      }
      c.mesh.position.set(c.x, 0, c.z); c.mesh.rotation.y = -stepX/Math.max(dt,1e-3)*0.05;
      c.tail.color.setHex(c.speed < c.base*0.85 ? 0xff5a40 : 0xb3261c);
      var spin = c.speed*dt/0.34; c.wheels.forEach(function(w){ w.rotation.x -= spin; });
      if (c.z > 34 || c.z < -560){ c.active = false; c.mesh.visible = false; c.respawn = 0.3 + rand()*Math.max(0.3, 1.4 - stage*0.15); count--; }
    }
  }
  // rain
  if (rain.visible && state!=='pause'){
    for (i=0;i<RAIN;i++){ var q = i*6, fall = 26*dt, dz = move*0.6;
      rainPos[q+1] -= fall; rainPos[q+4] -= fall; rainPos[q+2] += dz; rainPos[q+5] += dz;
      if (rainPos[q+1] < 0 || rainPos[q+2] > 9) seedDrop(i, rainPos[q+2] > 9); }
    rainGeo.attributes.position.needsUpdate = true; rain.position.x = camera.position.x;
  }
  // player visuals
  var pm = player.mesh;
  pm.position.set(player.x, 0, 0);
  player.body.rotation.z = input.steer*Math.min(1, v/25)*0.055;
  player.body.rotation.x = playing ? (input.brake && v>2 ? 0.03 : (input.gas||boosting) ? -0.012 - (boosting?0.012:0) : 0) : 0;
  var ps = v*dt/0.34; player.wheels.forEach(function(w,k){ w.rotation.x -= (state==='pause'?0:ps); if (k<2) w.rotation.y = -input.steer*0.4; });
  player.tail.color.setHex(playing && input.brake ? 0xff5a40 : 0xb3261c);
  flame.visible = boosting; if (boosting) flame.scale.set(1, 0.8+rand()*0.5, 1);
  pm.visible = !(invuln > 0 && state==='play' && (time*14 % 1) < 0.35);
  // camera
  var portrait = camera.aspect < 1, sh = shake > 0 ? shake : 0; if (shake > 0) shake -= dt;
  if (state==='play') sh += Math.min(0.06, Math.max(0, v-50)*0.0009);
  if (state==='menu'){
    pm.rotation.y = 0; var ang = time*0.35 + 2.4, r = portrait ? 8.5 : 7;
    camera.fov = portrait ? 62 : 42; camera.updateProjectionMatrix();
    camera.position.set(Math.sin(ang)*r, 2.3, Math.cos(ang)*r); camera.lookAt(0, 0.6, 0);
  } else {
    pm.rotation.y = -player.yaw;
    camera.fov = (portrait ? 80 : 60) + Math.min(32, v*0.2) + (boosting?6:0); camera.updateProjectionMatrix();
    if (save.hood && player.eye){
      camera.position.set(player.x - Math.sin(player.yaw)*player.eye[1] + (rand()-.5)*sh, player.eye[0] + (rand()-.5)*sh*0.6, Math.cos(player.yaw)*player.eye[1]);
      camera.lookAt(player.x + Math.sin(player.yaw)*30, player.eye[0]-0.25, -Math.cos(player.yaw)*30);
      camera.rotation.z += -input.steer*Math.min(1,v/30)*0.02;
    } else {
      camYaw += (player.yaw*0.7 - camYaw)*Math.min(1, dt*3);
      var cd = portrait?9.2:7.6;
      camera.position.set(player.x - Math.sin(camYaw)*cd + (rand()-.5)*sh*1.4, (portrait?3.9:3.1) + (rand()-.5)*sh, Math.cos(camYaw)*cd);
      camera.lookAt(player.x + Math.sin(camYaw)*12, 1.1, -Math.cos(camYaw)*12);
      camera.rotation.z += -input.steer*Math.min(1,v/30)*0.035;
    }
  }
  // hud
  var f = v/MAXV, g = 1; while (g < 6 && f > GEARS[g]) g++;
  var rpmF = v < 0.5 ? 0.12 : 0.3 + 0.7*clamp((f - GEARS[g-1])/(GEARS[g]-GEARS[g-1]), 0, 1);
  if (state!=='menu'){
    $('spd').textContent = Math.round(v*3.6); $('gear').textContent = v < 0.5 ? 'N' : g;
    $('rpm').style.width = (rpmF*100).toFixed(0)+'%'; $('rpm').style.background = rpmF > 0.9 ? 'var(--tail)' : 'var(--amber)';
    $('hp').style.width = health.toFixed(0)+'%'; $('hp').style.background = health < 35 ? 'var(--tail)' : 'var(--good)';
    $('nos').style.width = nitro.toFixed(0)+'%';
    $('odo').textContent = ('000'+(dist/1000).toFixed(2)).slice(-6);
    $('score').textContent = score(); $('coins').textContent = pickups*5;
    var w = $('wheel'); w.style.transform = 'rotate(' + (input.steer*WHEEL_LOCK).toFixed(1) + 'deg)'; w.setAttribute('aria-valuenow', input.steer.toFixed(2));
  }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (audio){
    var on = save.sound && state==='play', t = audio.ctx.currentTime, fr = 52 + rpmF*105 + g*5;
    audio.o1.frequency.setTargetAtTime(fr, t, 0.04); audio.o2.frequency.setTargetAtTime(fr/2, t, 0.04);
    audio.f.frequency.setTargetAtTime(350 + rpmF*900 + (boosting?600:0), t, 0.08);
    audio.g.gain.setTargetAtTime(on ? 0.03 + ((input.gas||boosting)?0.03:0) : 0, t, 0.08);
    audio.wf.frequency.setTargetAtTime(500 + Math.min(1800, v*9), t, 0.1); audio.wg.gain.setTargetAtTime(on ? Math.min(0.09, v*0.001) : 0, t, 0.1);
  }
}
addEventListener('resize', resize); resize();
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
menuCard();
requestAnimationFrame(frame);
})();
</script>
